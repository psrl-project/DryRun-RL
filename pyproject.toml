[project]
name = "dryrun-rl"
version = "0.1.0"
description = "Async disaggregate RL training simulator"
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.0",
]
profile = [
    "vllm",
    "aiohttp>=3.8",
]

[project.scripts]
dryrun = "dryrun.cli.main:main"
dryrun-profile = "dryrun.cli.profile:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dryrun*"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["dryrun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
