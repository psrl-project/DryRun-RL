# Fitted Hydraulis V1 training cost. Requires a profile JSONL regression artifact.
name: hydraulis

# Path to a CostArtifact produced by `dryrun-regress training`.
artifact_path: ""

# Simulated training mesh. Lookup is exact in TP/PP/CP; DP is the V1 analytical extension.
parallelism:
  tp: 1
  pp: 1
  dp: 1
  cp: 1

# Sequences per microbatch on one DP rank. Splits the global batch.
micro_batch_size: 1

# Pipeline schedule. V1 only accepts 1f1b.
schedule: 1f1b

# Activation checkpoint policy. Must match a profiled discrete cell.
activation_recompute: none

# Optimizer name. Must match a profiled discrete cell.
optimizer: adam

# Dtypes used by the static parameter inventory and cell lookup.
parameter_dtype: bf16
gradient_dtype: fp32
optimizer_state_dtype: fp32

# When true, optimizer state is additionally sharded by DP.
distributed_optimizer: true

# When false, numerical features outside the profiled range fail fast.
allow_extrapolation: false

# Per-GPU capacity in MiB used by the simulator to flag OOM. null disables the check.
gpu_memory_mib: null
