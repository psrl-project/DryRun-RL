# Output-length distribution, loaded from a fitted trace artifact (see
# `dryrun-workload fit-output`).
output:
  name: from_trace

  # Path to a JSONL or Parquet trace file.
  trace_path: ""

  # Column/key holding the length value.
  trace_column: length

  # Optional cap on the number of lengths read from the trace. 0 = all rows.
  n: 0

  # RNG seed (unused by from_trace, kept for schema consistency).
  seed: 42

# Prompt-length distribution, loaded from a fitted trace artifact (see
# `dryrun-workload fit-prompt`).
prompt:
  name: from_trace

  # Path to a JSONL or Parquet trace file.
  trace_path: ""

  # Column/key holding the length value.
  trace_column: length

  # Optional cap on the number of lengths read from the trace. 0 = all rows.
  n: 0

  # RNG seed (unused by from_trace, kept for schema consistency).
  seed: 42
