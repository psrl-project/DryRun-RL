# Inference cost model name.
name: roofline

# Floor latency per engine step (kernel launch + scheduler), in seconds.
F: 0.005

# Per-step fixed overhead (sampling, detokenization), in seconds.
W: 0.001

# Per-token GEMM cost (QKV + MLP + output projection), in seconds/token.
G: 0.0001

# Prefill attention cost coefficient (scales with chunk length squared).
A_p: 0.0

# Decode attention cost per KV-cache token, in seconds.
A_d: 1.0e-7
